[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biblioteca"
version = "1.0.0"
description = "Biblioteca — catálogo personal de libros y películas (proyecto del curso de Python)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Academy" }]
dependencies = []

[project.scripts]
bib = "biblioteca.cli:main"

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/biblioteca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 88
target-version = "py312"
