// ─── MÓDULO 17 ─── Lección 3: gRPC — Contrato del CMS ───
// content.proto define el contrato (schema-first): mensajes + servicio ANTES del código.
// Protobuf serializa en binario (más pequeño y rápido que JSON) con tipos fuertes.
//
// Convenciones del archivo:
//   - syntax "proto3": versión del lenguaje de esquemas (la actual por defecto).
//   - csharp_namespace: namespace que usarán las clases C# generadas por Grpc.Tools.
//   - package cms.v1: espacio de nombres lógico del contrato (versionado, como una API REST).
//
// REGLA DE ORO: los números de campo (1, 2, 3...) son el IDENTIFICADOR del campo en el wire format.
// Nunca reutilices ni cambies el número de un campo existente: rompería la compatibilidad.

syntax = "proto3";

option csharp_namespace = "Cms.Grpc.V1";

package cms.v1;

// Necesario para google.protobuf.Timestamp (fecha/hora estándar de Protobuf).
// Timestamp se mapea en C# a Google.Protobuf.WellKnownTypes.Timestamp.
import "google/protobuf/timestamp.proto";

// ContentService expone operaciones del CMS sobre Posts.
// Los 4 tipos de RPC que existen en gRPC (aquí usamos 3):
//   1. Unario:            rpc A(Request) returns (Response);          ← GetPost, CreatePost
//   2. Streaming servidor: rpc B(Request) returns (stream Response);  ← ListPosts
//   3. Streaming cliente:  rpc C(stream Request) returns (Response);  ← (no usado aquí)
//   4. Bidireccional:     rpc D(stream Request) returns (stream Response); ← (no usado aquí)
service ContentService {
  // UNARIO: devuelve un post por id (o error NOT_FOUND vía RpcException).
  rpc GetPost(GetPostRequest) returns (PostReply);

  // STREAMING SERVIDOR: envía muchos PostReply sobre la misma conexión HTTP/2.
  // El cliente los consume con `await foreach`.
  rpc ListPosts(ListPostsRequest) returns (stream PostReply);

  // UNARIO: crea un post y lo devuelve ya persistido (con id y fecha asignados).
  rpc CreatePost(CreatePostRequest) returns (PostReply);
}

// ── Mensajes de petición ──────────────────────────────────────────

// Petición unaria para GetPost. El campo 1 es el identificador del post.
message GetPostRequest {
  string id = 1;
}

// Petición para ListPosts: filtros simples de lectura.
// bool/int32 usan valores por defecto (false / 0) si no se envían: campos "opcionales" implícitos.
message ListPostsRequest {
  // Si true, solo se emiten posts publicados.
  bool published_only = 1;
  // Máximo de posts a emitir (0 = sin límite).
  int32 limit = 2;
}

// Petición para crear un post. `repeated` = lista ordenada (se mapea a RepeatedField<string>,
// que se usa como una IList<string> normal en C#).
message CreatePostRequest {
  string title = 1;
  string excerpt = 2;
  repeated string tags = 3;
}

// ── Mensaje de respuesta ──────────────────────────────────────────

// Representación de un post del CMS en el wire format.
// Equivalente a un DTO de JSON, pero binario y tipado.
message PostReply {
  string id = 1;
  string title = 2;
  string excerpt = 3;
  repeated string tags = 4;
  // Fecha de publicación. Si es null en C# significa "no publicada".
  // En protobuf3 los mensajes (como Timestamp) SÍ son nullables como referencia C#.
  google.protobuf.Timestamp published_at = 5;
}
