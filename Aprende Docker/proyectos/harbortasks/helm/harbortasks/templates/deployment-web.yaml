# helm/harbortasks/templates/deployment-web.yaml — Web (nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "harbortasks.labels" . | nindent 4 }}
    tier: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      tier: web
  template:
    metadata:
      labels:
        {{- include "harbortasks.labels" . | nindent 8 }}
        tier: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.images.registry }}{{ .Values.images.web.name }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}