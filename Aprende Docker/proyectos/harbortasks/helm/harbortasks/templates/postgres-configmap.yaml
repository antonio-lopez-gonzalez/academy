# helm/harbortasks/templates/postgres-configmap.yaml — migración inicial
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "harbortasks.labels" . | nindent 4 }}
data:
  001-init.sql: |
    -- Tabla de tareas de HarborTasks (v1 del esquema)
    CREATE TABLE IF NOT EXISTS tasks (
      id SERIAL PRIMARY KEY,
      title TEXT NOT NULL,
      done BOOLEAN NOT NULL DEFAULT false,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    INSERT INTO tasks (title) VALUES
      ('Desplegar HarborTasks en Kubernetes'),
      ('Endurecer el SecurityContext')
    ON CONFLICT DO NOTHING;