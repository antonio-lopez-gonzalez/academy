# helm/harbortasks/templates/service-postgres.yaml — nombre DNS estable para la BD
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "harbortasks.labels" . | nindent 4 }}
    tier: db
spec:
  selector:
    tier: db
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}