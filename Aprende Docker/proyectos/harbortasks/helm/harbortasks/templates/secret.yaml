# helm/harbortasks/templates/secret.yaml — 🔒 Secretos (Base64, didáctico)
apiVersion: v1
kind: Secret
metadata:
  name: harbor-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "harbortasks.labels" . | nindent 4 }}
type: Opaque
data:
  # Los valores se codifican en Base64 dentro del template
  database-url: {{ .Values.secret.databaseUrl | b64enc | quote }}
  postgres-password: {{ .Values.secret.postgresPassword | b64enc | quote }}