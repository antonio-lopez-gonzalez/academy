# helm/harbortasks/templates/configmap.yaml — Config no sensible
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "harbortasks.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.apiConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}