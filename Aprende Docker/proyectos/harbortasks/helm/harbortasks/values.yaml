# helm/harbortasks/values.yaml — VALORES POR DEFECTO del chart
# Todo lo que varía entre entornos (dev/prod) se configura aquí o con --set.

# Namespace donde se instala la release
namespace: harbortasks

images:
  registry: ""            # p. ej. "ghcr.io/tuusuario/" para producción
  api:
    name: harbortasks-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent   # en CI/prod con registry: Always
  web:
    name: harbortasks-web
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  postgres:
    name: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

api:
  replicaCount: 2
  port: 3000
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

web:
  replicaCount: 2
  port: 80
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "128Mi" }

postgres:
  replicaCount: 1
  port: 5432
  storage: 1Gi
  user: harbor
  database: harbortasks
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

# ConfigMap de la API (no sensible)
apiConfig:
  PORT: "3000"
  NODE_ENV: production

# 🔒 Secretos — NUNCA versionar reales; ejemplo didáctico a modo de "cobra val"
secret:
  databaseUrl: "postgres://harbor:harborpass@postgres:5432/harbortasks"
  postgresPassword: "harborpass"

# Ingress (lección M7-04 / M9-03)
ingress:
  enabled: true
  className: nginx
  host: harbor.test
  tls:
    enabled: false   # en producción: true + cert-manager

# Autoscaling de la API
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

# SecurityContext global (usuarios no-root)
securityContext:
  runAsNonRoot: true
  runAsUser: 10001