# k8s/postgres/service.yaml — nombre DNS estable para la BD (SOLO interno)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: harbortasks
  labels:
    app: harbortasks
    tier: db
spec:
  selector:
    app: harbortasks
    tier: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
# No se expone al exterior: lo consume únicamente el API vía "postgres:5432".