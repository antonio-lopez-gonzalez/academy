# k8s/postgres/deployment.yaml — PostgreSQL de HarborTasks
# Un único nodo de datos (suficiente para el curso). El pod es efímero;
# los datos viven en el PVC (postgres-data), no en el contenedor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: harbortasks
  labels:
    app: harbortasks
    tier: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbortasks
      tier: db
  template:
    metadata:
      labels:
        app: harbortasks
        tier: db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: harbor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: harbortasks
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "harbor", "-d", "harbortasks"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "harbor"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata                 # carpeta dedicada dentro del PVC
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d   # migraciones iniciales
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-sql
          configMap:
            name: postgres-init