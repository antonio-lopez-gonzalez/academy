# k8s/postgres/pvc.yaml — disco persistente de PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: harbortasks
  labels:
    app: harbortasks
    tier: db
spec:
  accessModes:
    - ReadWriteOnce              # un solo nodo escribe a la vez (suficiente aquí)
  resources:
    requests:
      storage: 1Gi