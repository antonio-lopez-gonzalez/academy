# k8s/postgres/configmap.yaml — migración inicial de HarborTasks
# Se monta en /docker-entrypoint-initdb.d y solo se ejecuta en el PRIMER
# arranque (volumen vacío). Idempotente gracias a IF NOT EXISTS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: harbortasks
data:
  001-init.sql: |
    -- Tabla de tareas de HarborTasks (v1 del esquema)
    CREATE TABLE IF NOT EXISTS tasks (
      id SERIAL PRIMARY KEY,
      title TEXT NOT NULL,
      done BOOLEAN NOT NULL DEFAULT false,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Dos tareas de ejemplo para que la web y el API muestren algo
    INSERT INTO tasks (title) VALUES
      ('Desplegar HarborTasks en Kubernetes'),
      ('Endurecer el SecurityContext')
    ON CONFLICT DO NOTHING;