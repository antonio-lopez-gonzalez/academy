# k8s/api/deployment.yaml — Deployment de la API de HarborTasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: harbortasks
  labels:
    app: harbortasks
    tier: api
spec:
  # Estado deseado: 2 réplicas (escalado horizontal)
  replicas: 2
  selector:
    matchLabels:
      app: harbortasks
      tier: api
  template:
    metadata:
      labels:
        app: harbortasks
        tier: api
    spec:
      # Usuario no-root desde el arranque
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: harbortasks-api:1.0.0   # cargada en kind con: kind load docker-image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # Config desde ConfigMap (fuera de la imagen)
          envFrom:
            - configMapRef:
                name: api-config
          # Secretos desde Secret (NO versionar credenciales)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: harbor-secrets
                  key: database-url
          # Probes: readiness corta el tráfico si no responde; liveness relanza si muere
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }