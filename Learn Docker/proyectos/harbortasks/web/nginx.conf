# web/nginx.conf — Configuración de la web de HarborTasks
# Sirve el SPA en / y hace proxy inverso de /api hacia el servicio api.

server {
    listen 80;
    server_name _;

    # Raíz del SPA estático
    root /usr/share/nginx/html;
    index index.html;

    # Proxy inverso: las peticiones a /api van al servicio "api" (DNS interno)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: si no existe el fichero, devuelve index.html (rutas de cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }
}