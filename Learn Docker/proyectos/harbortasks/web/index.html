<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarborTasks</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #e6edf3; background: #0d1117; }
    h1 { font-size: 28px; }
    .bar { display: flex; gap: 8px; margin: 16px 0; }
    .bar input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #3b4350; background: #161b22; color: #e6edf3; }
    .bar button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2496ed; color: #0d1117; font-weight: 600; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px; border: 1px solid #2d333f; border-radius: 6px; }
    li.done span { text-decoration: line-through; opacity: .6; }
    .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: rgba(50,108,229,.2); color: #a5c4ff; margin-bottom: 8px; }
  </style>
</head>
<body>
  <span class="tag">HarborTasks · web</span>
  <h1>Tus tareas en el puerto 🐳</h1>

  <div class="bar">
    <input id="title" placeholder="Escribe una tarea…">
    <button id="add">Añadir</button>
  </div>

  <ul id="list"></ul>

  <script>
    // SPA de ejemplo: la API vive en /api (proxy de nginx hacia el servicio api)
    async function loadTasks() {
      const res = await fetch("/api/tasks");
      const tasks = await res.json();
      const list = document.getElementById("list");
      list.innerHTML = tasks.map(t => `
        <li class="${t.done ? 'done' : ''}">
          <span>${t.title}</span>
          <button data-id="${t.id}" data-done="${t.done}">${t.done ? "Reabrir" : "Completar"}</button>
        </li>`).join("");
      list.querySelectorAll("button").forEach(btn =>
        btn.addEventListener("click", async () => {
          await fetch(`/api/tasks/${btn.dataset.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ done: btn.dataset.done !== "true" })
          });
          loadTasks();
        })
      );
    }

    document.getElementById("add").addEventListener("click", async () => {
      const title = document.getElementById("title").value.trim();
      if (!title) return;
      await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title })
      });
      document.getElementById("title").value = "";
      loadTasks();
    });

    loadTasks();
  </script>
</body>
</html>
