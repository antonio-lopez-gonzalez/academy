# k8s/api/service.yaml — Service que da una IP/DNS estable a la API
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: harbortasks
  labels:
    app: harbortasks
    tier: api
spec:
  type: ClusterIP
  selector:
    app: harbortasks
    tier: api
  ports:
    - name: http
      port: 3000
      targetPort: 3000