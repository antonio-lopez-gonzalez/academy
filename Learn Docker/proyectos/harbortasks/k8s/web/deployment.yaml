# k8s/web/deployment.yaml — Deployment de la web de HarborTasks (nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: harbortasks
  labels:
    app: harbortasks
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harbortasks
      tier: web
  template:
    metadata:
      labels:
        app: harbortasks
        tier: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: web
          image: harbortasks-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf   # sobrescribe el default
              subPath: nginx.conf                          # solo monta esta clave
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: nginx-config
          configMap:
            name: web-config