# k8s/web/configmap.yaml — nginx.conf que sirve el SPA y proxya /api → api
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: harbortasks
  labels:
    app: harbortasks
    tier: web
data:
  nginx.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Proxy inverso: /api/ va al Service del API (DNS interno del clúster)
      location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }