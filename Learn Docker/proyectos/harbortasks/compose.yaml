# compose.yaml — Stack completo de HarborTasks (dev local)
# Uso: docker compose up -d --build
#  - web     : nginx sirve el SPA y hace proxy de /api hacia la api
#  - api     : Node/Express con el CRUD de tareas
#  - postgres: base de datos con volumen persistente

services:
  web:
    build: ./web
    image: harbortasks-web:1.0.0
    # La web es pública en el puerto 8080 del host
    ports:
      - "8080:80"
    # Comunica con la api a través de la red interna del proyecto
    depends_on:
      - api
    networks:
      - harbor-net

  api:
    build: ./api
    image: harbortasks-api:1.0.0
    # Expone la API REST en localhost:3000 para desarrollo
    ports:
      - "3000:3000"
    environment:
      # Host DNS interno de Compose: nombre de servicio == nombre de host
      DATABASE_URL: postgres://harbor:harborpass@postgres:5432/harbortasks
      PORT: "3000"
    # La api no debe arrancar hasta que postgres RESPONDA a pg_isready
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - harbor-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harborpass  # ⚠️ solo dev; en producción usar Secret
      POSTGRES_DB: harbortasks
    # Volumen con nombre: la BD sobrevive a down/up
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Healthcheck: sin él, depends_on no sabe cuándo postgres está LISTO
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbortasks"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - harbor-net

# Red bridge propia: DNS interno por nombre de servicio
networks:
  harbor-net:

# Volúmenes con nombre gestionados por Docker
volumes:
  pgdata: