# helm/harbortasks/templates/service-api.yaml
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "harbortasks.labels" . | nindent 4 }}
    tier: api
spec:
  type: ClusterIP
  selector:
    tier: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}