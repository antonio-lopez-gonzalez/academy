# Entorno local del curso Redis para .NET: Redis + RedisInsight.
# Usa: docker compose up -d
services:
  redis:
    image: redis:7.4-alpine
    # AOF para no perder lo escrito (>config de la lección M4-01).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "8001:8001"   # GUI web
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data: