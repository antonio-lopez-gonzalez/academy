services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: academy-job-queue
    hostname: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    environment:
      RABBITMQ_DEFAULT_USER: taller-api
      RABBITMQ_DEFAULT_PASS: taller-api-secret
      RABBITMQ_DEFAULT_VHOST: taller
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  rabbitmq-data:
