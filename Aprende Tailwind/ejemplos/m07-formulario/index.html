<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo: Formulario de Registro — Curso Tailwind CSS v4</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-slate-800 mb-1">Crear cuenta</h2>
    <p class="text-sm text-slate-500 mb-6">Comienza tu prueba gratuita de 14 días</p>

    <form id="register-form" class="space-y-5">
      <!-- Nombre -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="first-name" class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
          <input id="first-name" type="text" placeholder="Ana" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow placeholder:text-slate-400">
        </div>
        <div>
          <label for="last-name" class="block text-sm font-medium text-slate-700 mb-1">Apellidos</label>
          <input id="last-name" type="text" placeholder="García" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow placeholder:text-slate-400">
        </div>
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input id="email" type="email" placeholder="ana@ejemplo.com" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow placeholder:text-slate-400">
        <p class="text-xs text-slate-400 mt-1 hidden" id="email-error">Introduce un email válido</p>
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <div class="relative">
          <input id="password" type="password" placeholder="Mínimo 8 caracteres" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow placeholder:text-slate-400 pr-10">
          <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 cursor-pointer text-sm">👁</button>
        </div>
        <!-- Indicador de fortaleza -->
        <div class="flex gap-1 mt-2">
          <div class="h-1 flex-1 rounded-full bg-slate-200 transition-colors" data-bar></div>
          <div class="h-1 flex-1 rounded-full bg-slate-200 transition-colors" data-bar></div>
          <div class="h-1 flex-1 rounded-full bg-slate-200 transition-colors" data-bar></div>
          <div class="h-1 flex-1 rounded-full bg-slate-200 transition-colors" data-bar></div>
        </div>
        <p class="text-xs text-slate-400 mt-1" id="password-strength-text">Debe tener al menos 8 caracteres</p>
      </div>

      <!-- Términos -->
      <div class="flex items-start gap-2">
        <input id="terms" type="checkbox" class="mt-1 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
        <label for="terms" class="text-sm text-slate-600">
          Acepto los <a href="#" class="text-indigo-600 hover:underline">términos y condiciones</a> y la <a href="#" class="text-indigo-600 hover:underline">política de privacidad</a>
        </label>
      </div>

      <!-- Botón -->
      <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700 active:scale-[0.98] transition-all duration-150 cursor-pointer flex items-center justify-center gap-2">
        <svg id="submit-spinner" class="h-5 w-5 animate-spin hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span id="submit-text">Crear cuenta</span>
      </button>
    </form>

    <!-- Toast (oculto por defecto) -->
    <div id="toast" class="fixed top-4 right-4 bg-green-600 text-white px-5 py-3 rounded-lg shadow-lg opacity-0 translate-y-[-20px] transition-all duration-300 pointer-events-none flex items-center gap-2 z-50">
      <span>✓</span> <span>¡Cuenta creada con éxito!</span>
    </div>

    <p class="text-center text-sm text-slate-400 mt-6">
      ¿Ya tienes cuenta? <a href="#" class="text-indigo-600 hover:underline font-medium">Inicia sesión</a>
    </p>
  </div>

  <script>
    const passwordInput = document.getElementById("password");
    const bars = document.querySelectorAll("[data-bar]");
    const strengthText = document.getElementById("password-strength-text");
    const toggleBtn = document.getElementById("toggle-password");
    const form = document.getElementById("register-form");
    const submitBtn = document.getElementById("submit-btn");
    const spinner = document.getElementById("submit-spinner");
    const submitText = document.getElementById("submit-text");
    const toast = document.getElementById("toast");

    toggleBtn.addEventListener("click", () => {
      const type = passwordInput.type === "password" ? "text" : "password";
      passwordInput.type = type;
      toggleBtn.textContent = type === "password" ? "👁" : "🙈";
    });

    passwordInput.addEventListener("input", () => {
      const val = passwordInput.value;
      let strength = 0;
      if (val.length >= 8) strength++;
      if (val.length >= 12) strength++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength++;
      if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) strength++;

      const colors = ["bg-slate-200", "bg-red-400", "bg-yellow-400", "bg-green-400", "bg-green-500"];
      const texts = ["Debe tener al menos 8 caracteres", "Débil", "Media", "Fuerte", "Muy fuerte"];

      bars.forEach((bar, i) => {
        bar.className = `h-1 flex-1 rounded-full transition-colors duration-300 ${i < strength ? colors[strength] : "bg-slate-200"}`;
      });
      strengthText.textContent = texts[strength];
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      spinner.classList.remove("hidden");
      submitText.textContent = "Creando cuenta...";

      setTimeout(() => {
        spinner.classList.add("hidden");
        submitText.textContent = "Crear cuenta";
        submitBtn.disabled = false;

        // Mostrar toast
        toast.classList.remove("opacity-0", "translate-y-[-20px]", "pointer-events-none");
        toast.classList.add("opacity-100", "translate-y-0");
        setTimeout(() => {
          toast.classList.add("opacity-0", "translate-y-[-20px]");
          toast.classList.remove("opacity-100", "translate-y-0");
        }, 3000);
      }, 1500);
    });
  </script>

  <p class="fixed bottom-4 left-4 text-xs text-slate-400">
    Ejemplo del Módulo 7 — <a href="../web/modulos/07-formularios-animaciones/04-proyecto-formulario-animado.html" class="text-indigo-500 hover:underline">Ver lección completa</a>
  </p>
</body>
</html>
