[project]
name = "copiloto"
version = "0.1.0"
description = "Copiloto de la Academy: asistente con RAG sobre los cursos (proyecto del curso Aprende IA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
copiloto = "copiloto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto"]
