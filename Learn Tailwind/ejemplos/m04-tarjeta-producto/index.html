<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo: Tarjeta de Producto — Curso Tailwind CSS v4</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 p-8">
  <div class="max-w-sm mx-auto bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
    <!-- Imagen con badge -->
    <div class="relative">
      <img src="https://placehold.co/400x250/6366f1/white?text=Producto" alt="Producto" class="w-full h-48 object-cover">
      <span class="absolute top-3 left-3 bg-rose-500 text-white text-xs font-bold px-2 py-1 rounded-full">-20%</span>
      <button class="absolute top-3 right-3 bg-white/80 backdrop-blur-sm p-2 rounded-full hover:bg-white hover:text-rose-500 transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
      </button>
    </div>

    <!-- Contenido -->
    <div class="p-5">
      <div class="flex items-center gap-1 mb-2">
        <span class="text-xs text-slate-400 uppercase tracking-wider">Electrónica</span>
      </div>
      <h3 class="text-lg font-semibold text-slate-800 mb-1">Auriculares Pro X200</h3>
      <p class="text-sm text-slate-500 mb-3">Cancelación de ruido activa, 30h de batería, Bluetooth 5.3</p>

      <!-- Rating -->
      <div class="flex items-center gap-1 mb-3">
        <span class="text-yellow-400 text-sm">★★★★★</span>
        <span class="text-xs text-slate-400">(128)</span>
      </div>

      <!-- Precio -->
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl font-bold text-slate-800">$79.99</span>
        <span class="text-sm text-slate-400 line-through">$99.99</span>
      </div>

      <!-- Colores disponibles -->
      <div class="flex gap-2 mb-4">
        <button class="w-6 h-6 rounded-full bg-slate-800 ring-2 ring-offset-2 ring-indigo-500 cursor-pointer" title="Negro"></button>
        <button class="w-6 h-6 rounded-full bg-white border-2 border-slate-300 hover:border-indigo-400 cursor-pointer" title="Blanco"></button>
        <button class="w-6 h-6 rounded-full bg-rose-500 hover:ring-2 hover:ring-offset-2 hover:ring-indigo-500 cursor-pointer" title="Rojo"></button>
      </div>

      <!-- Botón -->
      <button class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700 active:scale-[0.98] transition-all duration-150 cursor-pointer flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/>
        </svg>
        Añadir al carrito
      </button>
    </div>
  </div>

  <p class="text-center text-sm text-slate-400 mt-6">
    Ejemplo del Módulo 4 — <a href="../web/modulos/04-tailwind-fundamentos/05-proyecto-tarjeta-producto.html" class="text-indigo-500 hover:underline">Ver lección completa</a>
  </p>
</body>
</html>
