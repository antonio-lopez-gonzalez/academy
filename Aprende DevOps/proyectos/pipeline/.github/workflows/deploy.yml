name: Deploy

on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to staging
        run: echo "deploy staging (mismo digest del build)"
      - name: Smoke test
        run: ./scripts/smoke.sh https://staging.example.com

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production   # requiere aprobación (required reviewers)
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to production
        run: echo "promote el artefacto ya probado a producción"
