[package]
name = "urlshort"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Acortador de URLs de línea de comandos y servidor HTTP — curso Aprende Rust"
license = "MIT"
readme = "README.md"
keywords = ["cli", "url", "shortener"]
categories = ["command-line-utilities"]

[dependencies]
axum = "0.8"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
