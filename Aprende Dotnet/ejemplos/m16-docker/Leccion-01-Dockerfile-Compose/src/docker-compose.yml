# ─── MÓDULO 16 ─── docker-compose.yml ───
# Orquesta múltiples contenedores: API + PostgreSQL + Redis
# docker compose up -d → levanta todo en segundo plano
# docker compose down → detiene y elimina los contenedores

version: "3.9"

services:
  # ─── API .NET 8 (nuestro CMS) ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Connection strings se pasan como variables de entorno
      # (en producción usar secrets manager: Azure Key Vault, AWS Secrets Manager, etc.)
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=cms;Username=cms;Password=secret
      - ConnectionStrings__Redis=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  # ─── PostgreSQL 16 ───
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      # Persistir datos en un volumen (sobrevive a reinicios del contenedor)
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Redis 7 ───
  redis:
    image: redis:7-alpine
    container_name: cms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# ─── Volúmenes (persistencia de datos) ───
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
