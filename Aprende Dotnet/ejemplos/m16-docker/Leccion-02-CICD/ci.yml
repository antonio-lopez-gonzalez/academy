# ─── MÓDULO 16 ─── CI/CD con GitHub Actions ───
# Este archivo debe ir en: .github/workflows/ci.yml
# Se ejecuta en cada push y pull request

name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    services:
      # PostgreSQL para integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cms_test
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis para integration tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Instalar .NET 8 SDK
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Paso 3: Restaurar paquetes NuGet
      - name: Restore dependencies
        run: dotnet restore

      # Paso 4: Compilar (sin restaurar de nuevo)
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Paso 5: Ejecutar tests unitarios
      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --filter "Category=Unit"

      # Paso 6: Ejecutar tests de integración (necesitan BD)
      - name: Run integration tests
        run: dotnet test --configuration Release --no-build --filter "Category=Integration"
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Database=cms_test;Username=cms;Password=secret
          ConnectionStrings__Redis: localhost:6379

      # Paso 7: Publicar artefactos (opcional, para deploy)
      - name: Publish
        run: dotnet publish -c Release -o ./publish --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-api
          path: ./publish
